name: Content quality

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Markdown content
        run: npm run content:check

      - name: Lint Markdown content path
        run: npx eslint src/lib/content.ts scripts/check-markdown-content.mjs 'src/app/posts/[category]/[slug]/page.tsx'

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
